# Merges to `main` go to `dev` (architecture §5.1, §18).
#
# Every step is guarded on its secret being present. All of them are set, so
# this deploys for real; the guards remain so that a rotated-away secret says
# exactly what is missing rather than failing the build — a red cross on `main`
# for infrastructure that was never set up teaches people to ignore red crosses.
name: deploy-dev

on:
  push:
    branches: [main]
    paths-ignore:
      # A Markdown change cannot alter the bundle or the database. Unlike
      # `check`, these produce artefacts rather than a verdict, and neither
      # scans for secrets nor gates a merge, so skipping the run outright is
      # safe. `docs/design/**` is deliberately absent: gen.py is the source the
      # design tokens come from.
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: What is configured
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          supabase=false; expo=false
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DEV_PROJECT_REF" ] && supabase=true
          [ -n "$EXPO_TOKEN" ] && expo=true
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "expo=$expo" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy to dev"
            echo ""
            echo "| Target | Configured |"
            echo "|---|---|"
            echo "| Supabase (\`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_DEV_PROJECT_REF\`) | $supabase |"
            echo "| Expo (\`EXPO_TOKEN\`) | $expo |"
            echo ""
            echo "Anything \`false\` is a missing secret — see docs/runbooks/environments.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'

      # Both consumers need dist/: app.config.ts imports @circles/config, and the
      # Edge Functions import @circles/domain through the import map. dist/ is
      # gitignored, so it exists only after a build. `pnpm check` gets away
      # without this because `typecheck` runs `tsc -b` first and leaves the
      # output behind; nothing on the deploy path does. This has to come before
      # the Supabase steps, not just before the export.
      - name: Build the workspace packages
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'
        run: pnpm run build

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.supabase == 'true'
        with:
          version: latest

      - name: Push migrations
        if: steps.config.outputs.supabase == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
          supabase db push --linked

      - name: Deploy Edge Functions
        if: steps.config.outputs.supabase == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"

      # A web build with no EXPO_PUBLIC_SUPABASE_URL compiles, deploys and
      # serves a client that cannot reach its backend. Fail here instead, where
      # the message says which variable is missing.
      - name: Check the client configuration
        if: steps.config.outputs.expo == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
        run: node scripts/check-client-env.mjs

      - name: Deploy the web build
        if: steps.config.outputs.expo == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -o pipefail
          pnpm --filter app exec eas whoami
          pnpm --filter app run export
          pnpm --filter app exec eas deploy --alias dev --non-interactive

      - name: Publish an update to the development channel
        # `development`, not `dev`: a channel only means anything if a build
        # subscribes to it, and the `development` profile in eas.json is what
        # the installed clients listen on. Architecture §5.1 calls this
        # environment `dev`; the channel keeps the profile's name so the two
        # cannot drift apart.
        if: steps.config.outputs.expo == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: development
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
          # Through the environment, never interpolated into the script. A
          # commit message is attacker-controllable text, and `${{ }}` is
          # substituted before the shell sees it — so a message containing a
          # quote and a semicolon would run as commands on a runner holding
          # EXPO_TOKEN and SUPABASE_ACCESS_TOKEN.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          # head_commit exists only on push. On workflow_dispatch it is empty,
          # and `eas update` refuses an empty message.
          message=$(printf '%s' "${COMMIT_MESSAGE:-Manual deploy of ${SHA}}" | head -1 | cut -c1-200)
          pnpm --filter app exec eas update --channel development --message "$message" --non-interactive
