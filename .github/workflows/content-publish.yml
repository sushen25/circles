# The content loop (content/CLAUDE.md): merge = approve. On a push to `main`
# that touches the queue, and on an evening schedule, publish anything in
# content/queue with `status: approved` that is due, then commit the ledger
# and the moved files to the `content-data` branch, never to `main`, which is
# protected (ADR 0089). The run starts from that branch (`main` plus what the
# bots have written and the founder has not merged yet), so it sees every
# ledger line there is.
#
# It must never post twice. Before a platform is called, the attempt is pushed
# as a tag (lib/databranch.ts); a run that finds a tag with no ledger row
# posts nothing and fails; a run that cannot sync, list or record posts
# nothing and fails. The save step runs even when the publisher failed, so
# whatever was posted is pushed. Nothing here ever runs `git push`: the one
# script that pushes is lib/databranch.ts, and check:workflows holds that.
name: content-publish
on:
  push:
    branches: [main]
    paths: ['content/queue/**']
  schedule:
    - cron: '*/30 7-13 * * *' # 18:00–00:30 Melbourne (AEDT), every half hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group for everything that writes to content-data (this, the nightly
  # pull and the series pull), so two runs never write the branch, or post, at
  # the same moment. A group keeps one pending run, so a newer one replaces it;
  # every one of these is run again on its next schedule.
  group: content-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: content

jobs:
  publish:
    runs-on: ubuntu-latest
    # A video renders frame by frame (a few minutes a piece on the runner).
    timeout-minutes: 30
    permissions:
      contents: write # the content-data branch and the attempt tags
      pull-requests: write # the one pull request from content-data to main
      actions: write # to start `check` on it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The data branch is merged with main, which needs their history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # Everything after this builds on the data branch. If it cannot be read
      # or main cannot be merged into it, the job stops here, red, before
      # anything is rendered or posted.
      - id: data
        name: start from the content-data branch
        run: node --experimental-strip-types lib/databranch.ts sync
      - run: npm ci
      # The slideshow guard (publish/guards.ts) refuses an item whose slides are
      # not in out/<slug>/, and out/ is never committed, so the runner renders
      # the due approved items itself: the stills, and the MP4 that Bluesky,
      # YouTube and TikTok upload (ADR 0086). Threads and Instagram fetch by URL
      # from MEDIA_BASE_URL, which this job does not fill (content/README.md,
      # "Going live", step 3); TikTok falls back to the MP4 when the stills
      # are not there.
      - run: npx playwright install --with-deps chromium
      - name: install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - run: npm run render -- --approved
      - run: npm run video -- --approved
      - run: npm run publish
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRES: ${{ vars.THREADS_TOKEN_EXPIRES }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      # Runs whether or not the publisher did, so a post that went out is
      # saved even when a later platform failed. If the push is rejected the
      # job is red, and the next run posts nothing (the attempt tag has no
      # ledger row behind it) until a person has looked.
      - id: save
        name: commit the ledger and the moves to content-data
        if: ${{ always() && steps.data.outcome == 'success' }}
        run: |
          node --experimental-strip-types lib/databranch.ts save "content: publish $(date -u +%Y-%m-%dT%H:%M)" queue published publish
      - name: open the data pull request and run check on it
        if: ${{ always() && steps.save.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types lib/databranch.ts open-pr
