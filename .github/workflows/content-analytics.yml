# The nightly pull for the content loop (content/analytics/pull.ts; the why is
# content/docs/analytics-plan.md). Reads only, against every platform that has
# a token, and one read-only POST to Wenna's keyed funnel export. It appends what it gets under content/analytics/: posts.jsonl (one
# row per post per platform, the platform's answer kept whole), account.jsonl
# (the account by day), funnel.jsonl (the Wenna funnel by tag, counts only), and new replies into content/inbox/<date>-replies.md
# with the handles already stripped, for the next /daily to mine. It may also
# claim a hand-posted Short by its link tag, which writes the id into the
# piece's queue file and a row into publish/ledger.jsonl, and may move the
# piece to published/ once every platform has an id. Everything it writes is
# under content/, and goes to the `content-data` branch, never to `main`,
# which is protected: the founder merges the one pull request from that
# branch (ADR 0089). Nothing here posts.
#
# After the pull, `npm run scorecard` rebuilds analytics/scorecard.json and
# scorecard.md from every row, and `npm run brief` rewrites
# content/context/learned.md from the scorecard, for /hooks and /skit to read
# the next morning. Both read files only.
#
# The pull step is allowed to fail so the commit step still runs: a Meta token
# inside seven days of expiry, or a configured platform that failed on every
# post, exits 1 after writing, and the last step turns that into a red job on
# the Actions page while the rows it did get are already on content-data.
name: content-analytics
on:
  schedule:
    - cron: '15 16 * * *' # 03:15 Melbourne, nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with content-series.yml and content-publish.yml: all three write
  # the content-data branch, so they take turns and never run beside each other.
  group: content-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: content

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the content-data branch
      pull-requests: write # the one pull request from content-data to main
      actions: write # to start `check` on it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # The pull starts from the data branch, so a claim sees the ledger lines
      # the publisher wrote that are not on main yet.
      - id: data
        name: start from the content-data branch
        run: node --experimental-strip-types lib/databranch.ts sync
      - run: npm ci
      # A platform with nothing set is skipped and says so (analytics/platforms/
      # module.ts), so every name is passed and an empty one is the same as
      # unset. Every `vars.*` is a repository variable, not a secret: the two
      # expiry dates (`npm run tokens -- --github` writes them), the YouTube
      # channel id, and BSKY_HANDLE, THREADS_USER_ID and IG_USER_ID, which
      # are account identifiers rather than credentials: each is public on
      # every post and is written into the committed raw rows. The tokens
      # stay secrets.
      - id: pull
        run: npm run analytics
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRES: ${{ vars.THREADS_TOKEN_EXPIRES }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }} # optional; empty means the module's default
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          # The Wenna funnel by tag (ADR 0087, platforms/wenna.ts). Unset, the
          # pull says "not configured" and goes on. The URL is a repository
          # variable (the prod `content-funnel` address, not a secret); the
          # secret is the same value as the function's, and opens that one
          # function and nothing else.
          WENNA_FUNNEL_URL: ${{ vars.WENNA_FUNNEL_URL }}
          CONTENT_FUNNEL_SECRET: ${{ secrets.CONTENT_FUNNEL_SECRET }}
      # Allowed to fail for the same reason as the pull: the rows are worth
      # committing even when the tables built from them are not.
      - id: scorecard
        run: npm run scorecard
        continue-on-error: true
      - id: brief
        if: steps.scorecard.outcome == 'success'
        run: npm run brief
        continue-on-error: true
      # The pull appends under analytics/ and inbox/; a claim writes the id
      # into a queue file and a row into publish/ledger.jsonl, and the move
      # that follows deletes from queue/ and adds to published/. `-A` with the
      # pathspec stages the deletion as well as the addition. inbox/screens/
      # is git-ignored, so a screenshot is never staged. A rejected push is
      # retried once on top of what is there; failing twice is red.
      - id: save
        name: commit rows, replies, claims, moves and the brief to content-data
        if: ${{ always() && steps.data.outcome == 'success' }}
        run: |
          node --experimental-strip-types lib/databranch.ts save "content: analytics $(date -u +%Y-%m-%d)" analytics inbox queue published publish context/learned.md
      - name: open the data pull request and run check on it
        if: ${{ always() && steps.save.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types lib/databranch.ts open-pr
      - name: fail when the pull, the scorecard or the brief did
        # Red on the Actions page for an expiring token, a platform that
        # failed on every post, or a scorecard or brief that would not build,
        # after the rows are committed, never instead.
        if: steps.pull.outcome == 'failure' || steps.scorecard.outcome == 'failure' || steps.brief.outcome == 'failure'
        run: exit 1
