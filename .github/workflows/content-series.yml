# The views-over-time curve for the content loop. Instagram shows how a Reel's
# views grew over its first days only in the app, and no API returns the
# curve, so the pull rebuilds it from snapshots: every two hours,
# `npm run analytics -- --series` reads every post under 48 hours old and
# appends one row per post to content/analytics/series.jsonl, the same shape
# as posts.jsonl plus `age_hours` (content/docs/analytics-plan.md, "Capture
# everything"). When no post is that young the pull exits at once and nothing
# is committed, so on most days this job is a checkout and an `npm ci`.
#
# It runs seven minutes past the even hours so it never lands on the round
# time the nightly pull and the publisher use, and it shares the nightly
# job's concurrency group so the two never append to analytics/ or push to
# main at the same moment. It commits series.jsonl and nothing else, under
# content/, so the commit runs nothing else (ADR 0081). Nothing here posts.
name: content-series
on:
  schedule:
    - cron: '7 */2 * * *' # every two hours, seven minutes past
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The nightly job's group, on purpose: one of the two runs at a time.
  group: content-analytics
  cancel-in-progress: false

defaults:
  run:
    working-directory: content

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci
      # The same names as content-analytics.yml, every one of them, so a
      # platform the nightly pull reads is never silently missing from the
      # curve. Allowed to fail for the same reason as there: the rows it got
      # are committed first, and the last step makes the job red.
      - id: series
        run: npm run analytics -- --series
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRES: ${{ vars.THREADS_TOKEN_EXPIRES }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }} # optional; empty means the module's default
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      - name: commit the series rows
        run: |
          git config user.name "wenna-content bot"
          git config user.email "bot@wenna.app"
          # Only series.jsonl, and only once it exists: the file is created by
          # the first run that finds a young post, and a pathspec that matches
          # nothing fails `git add`.
          if [ -f analytics/series.jsonl ]; then git add -- analytics/series.jsonl; fi
          git diff --cached --quiet || git commit -m "content: series $(date -u +%Y-%m-%dT%H:%M)"
          git push
      - name: fail when the pull did
        if: steps.series.outcome == 'failure'
        run: exit 1
