# A web preview per pull request, so a screen can be looked at before it is
# merged rather than described in the PR body.
name: preview

on:
  pull_request:
    paths-ignore:
      # A Markdown change cannot alter the bundle or the database. Unlike
      # `check`, these produce artefacts rather than a verdict, and neither
      # scans for secrets nor gates a merge, so skipping the run outright is
      # safe. `docs/design/**` is deliberately absent: gen.py is the source the
      # design tokens come from.
      - '**.md'
      - '.claude/**'
      # The content loop: its own npm project, outside the bundle and the
      # database (content/CLAUDE.md), committed to most evenings by its bot.
      - 'content/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks do not get the token, and should not.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Is Expo configured
        id: config
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No EXPO_TOKEN — previews need it; see docs/runbooks/environments.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.config.outputs.ready == 'true'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.config.outputs.ready == 'true'

      # app.config.ts imports @circles/config, which resolves to dist/. dist/ is
      # gitignored, so it exists only after a build. `pnpm check` gets away
      # without this because `typecheck` runs `tsc -b` first and leaves the
      # output behind; nothing on the deploy path does.
      - name: Build the workspace packages
        if: steps.config.outputs.ready == 'true'
        run: pnpm run build

      - name: Deploy to a per-PR alias
        id: deploy
        if: steps.config.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Previews point at `dev`, never at production data.
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          # pipefail matters here: without it a failed `eas deploy` is masked by
          # the exit status of the command it pipes into, and the step passes.
          set -o pipefail
          # Say which identity the token resolves to. An EAS permission error
          # names the app but not the viewer, so without this the only way to
          # tell a wrong role from a wrong account is to guess.
          pnpm --filter app exec eas whoami
          pnpm --filter app run export
          pnpm --filter app exec eas deploy \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --non-interactive --json | tee eas-deploy.json
          url=$(node scripts/deploy-url.mjs < eas-deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Say where it is
        if: steps.config.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            Preview for `${{ github.event.pull_request.head.sha }}`:
            ${{ steps.deploy.outputs.url }}
