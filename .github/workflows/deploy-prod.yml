# Production is deployed by a person, on purpose (architecture §18).
#
# `workflow_dispatch` only, in two jobs (SUS-105):
#
# - `plan` has no environment, so nothing waits for it. It refuses a commit whose
#   `check` run is not a success, refuses a dispatch that does not confirm the
#   backup, and writes the migrations and functions this deploy would change
#   into the run summary.
# - `apply` is in the `production` environment, whose required reviewer is the
#   approval. It `needs: plan`, so the approval prompt only appears once the
#   plan is readable and the commit is green; a red or still-running commit
#   fails in `plan`, before anyone is asked.
#
# A release is tagged `prod-<yyyymmdd>-<shortsha>` once `apply` has succeeded,
# by a third job (`tag`) that is the only place with `contents: write` and reads
# no secret (SUS-144). The `rollback_to` input names one of those tags and
# redeploys its functions and web build: `plan` resolves it to a commit, checks
# that commit's own `check` run like any other, and `apply` deploys that commit
# without pushing or planning any migration (they are forward-only). Rolled back
# or not, `apply` ends by looking at the live site (scripts/smoke-web.mjs and
# `pnpm check:env`), so a deploy that landed badly ends red.
#
# `plan` cannot run `db push --dry-run`: that needs the production access token,
# and a job that can read it has already been approved. Its list comes from git
# and the deployments API (scripts/prod-plan.mjs). The dry run still runs, first
# in `apply`.
#
# Its credentials are secrets of the `production` environment, not of the
# repository, so only a job that has passed that approval can read them
# (SUS-104). They have names no other workflow uses — `SUPABASE_PROD_ACCESS_TOKEN`
# and `EXPO_PROD_TOKEN` — because an environment secret that shares a name with
# a repository secret falls back to the repository one when it is missing: a
# deleted production token would quietly become a deploy with the dev token.
# `check:workflows` refuses these names anywhere but a `production` job, and
# holds the shape of `plan` and `apply` in place.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the word deploy to confirm
        required: true
        type: string
      backup:
        description: Type backed-up once the pre-deploy dump is stored privately (docs/runbooks/production-deploy.md, step 1)
        required: true
        type: string
      rollback_to:
        description: Leave empty to deploy this commit. A prod-yyyymmdd-sha tag (git tag -l 'prod-*') redeploys that release's functions and web build and applies no migration (docs/runbooks/production-deploy.md, Rolling back)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `environment`: the approval comes after this job, not before it.
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
    # What `apply` and `tag` deploy: this commit, or the one `rollback_to` names.
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      rollback: ${{ steps.target.outputs.rollback }}
      tag: ${{ steps.target.outputs.tag }}

    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
          BACKUP: ${{ inputs.backup }}
        run: |
          [ "$CONFIRM" = "deploy" ] || {
            echo "Type 'deploy' to confirm." >&2
            exit 1
          }
          [ "$BACKUP" = "backed-up" ] || {
            echo "Take the backup first (docs/runbooks/production-deploy.md, step 1), then dispatch again with 'backed-up'." >&2
            exit 1
          }

      # The full history, because the plan diffs this commit against the one
      # production was last deployed from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve what to deploy
        id: target
        env:
          HEAD_SHA: ${{ github.sha }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: node scripts/release.mjs resolve --head "$HEAD_SHA" --tag "$ROLLBACK_TO"

      # A commit is deployed only if its own `check` run succeeded. No run,
      # queued, in progress, cancelled and timed out all refuse, not just
      # `failure`: three production deploys on 3, 5 and 9 October went out on a
      # failed, a cancelled and a still-running check.
      - name: Refuse a commit whose check is not green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/green-check.mjs --repo "$REPO" --sha "$SHA"

      - name: What this deploy changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          ROLLBACK_TAG: ${{ steps.target.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/prod-plan.mjs --repo "$REPO" --sha "$SHA" --rollback "$ROLLBACK_TAG" --head "$HEAD_SHA"

      - name: What to check before approving
        run: |
          {
            echo "### Before approving"
            echo ""
            echo "- The backup of \`circles-prod\` was taken for this deploy and is stored privately (the dispatcher typed \`backed-up\`)."
            echo "- The migration list above is the one you expect. A migration with no transaction can be left half applied. (A rollback applies none.)"
            echo "- Rejecting the approval stops here, before anything has changed."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: deploy to prod
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure this environment with a required reviewer. That approval is
    # the gate; the inputs above only guard against a mis-click.
    environment: production

    steps:
      # The commit `plan` resolved: the dispatched one, or a rollback's tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # Unlike deploy-dev, a missing secret here is a failure, not a skip. A
      # production deploy that deploys nothing and reports success is the one
      # green tick that most needs to be true.
      - name: What is configured
        env:
          SUPABASE_PROD_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          EXPO_PROD_TOKEN: ${{ secrets.EXPO_PROD_TOKEN }}
        run: |
          missing=""
          for name in SUPABASE_PROD_ACCESS_TOKEN SUPABASE_PROD_PROJECT_REF EXPO_PROD_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing from the production environment's secrets:$missing — see docs/runbooks/ci.md." >&2
            exit 1
          fi

      # Nothing below runs without this: `pnpm run build`, every
      # `pnpm exec supabase`, and the export all go through pnpm. It sat after
      # the Supabase steps until Codex noticed, which nothing else would have —
      # this workflow has never run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Edge Functions import @circles/domain through the import map. dist/ is
      # gitignored, so it exists only after a build. `pnpm check` gets away
      # without this because `typecheck` runs `tsc -b` first and leaves the
      # output behind; nothing on the deploy path does. This has to come before
      # the Supabase steps, not just before the export.
      # A web build with no EXPO_PUBLIC_SUPABASE_URL compiles, deploys and
      # serves a client that cannot reach its backend. Fail here instead, where
      # the message says which variable is missing.
      #
      # Before the Supabase steps, not after them. It used to sit just above the
      # web deploy, which reads as the right place — it guards the export — but
      # the two steps it was sitting below both change the project for good. A
      # missing variable then left production with a new schema and new
      # functions and no client, from a job that reported failure: the one
      # guard whose whole purpose is to fail early, failing last. Nothing here
      # touches anything outside the runner, so the only cost of moving it up
      # is that it runs on deploys that would not have used it.
      - name: Check the client configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_BUILD_ID: ${{ needs.plan.outputs.sha }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
          REQUIRE_TURNSTILE: 'true'
        run: node scripts/check-client-env.mjs

      - name: Build the workspace packages
        run: pnpm run build

      # The CLI's own list, read from the project. The list a reviewer saw before
      # approving came from git (the `plan` job); this one is the project's.
      #
      # A rollback has fewer migrations than the database, and `db push` refuses
      # a remote history the checkout does not have. It is skipped inside the
      # script, not with an `if`: no production step may be conditional, and
      # `check:workflows` holds both of these to reading ROLLBACK.
      - name: Dry run of the migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}
          ROLLBACK: ${{ needs.plan.outputs.rollback }}
        run: |
          pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
          if [ "$ROLLBACK" = "true" ]; then
            echo "Rollback: migrations are forward-only, no dry run."
          else
            pnpm exec supabase db push --linked --dry-run
          fi

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}
          ROLLBACK: ${{ needs.plan.outputs.rollback }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then
            echo "Rollback: migrations are forward-only, nothing pushed."
          else
            pnpm exec supabase db push --linked
          fi

      # `deploy-dev` has had this step since S0-06; production never did, and
      # nothing noticed until there were functions to deploy. Without it
      # production gets the new schema and the new client and keeps the old
      # functions — a client calling endpoints that are not there.
      #
      # After the migrations, because a function deployed against a schema that
      # has not arrived yet fails on its first request rather than its first
      # deploy.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PROD_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
      - name: Deploy the web build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PROD_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_BUILD_ID: ${{ needs.plan.outputs.sha }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -o pipefail
          pnpm --filter app exec eas whoami
          pnpm --filter app run export
          pnpm --filter app exec eas deploy --prod --non-interactive

      # The deploy has already happened by here; what this step does is make the
      # run red, so the founder knows, when the site is not serving it. The
      # public host needs no secret. `check:env` takes the host out of the
      # origin the build was exported with.
      - name: Smoke test the live site
        env:
          APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          case "$APP_ORIGIN" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_APP_ORIGIN must be an https origin, got '$APP_ORIGIN'." >&2; exit 1 ;;
          esac
          node scripts/smoke-web.mjs --origin "$APP_ORIGIN" --wait 120 --sha "$DEPLOYED_SHA"
          pnpm check:env "${APP_ORIGIN#https://}"

  # Tags the release. Its own job so that `contents: write` is held by one job
  # that reads no secret and never sees one; `apply` keeps `contents: read`.
  # Not in `production`, so it does not ask for the approval a second time. It
  # runs only if `apply` succeeded, smoke test included. A rollback names the
  # tag it redeployed and creates none.
  tag:
    name: tag the release
    needs: [plan, apply]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Tag the deployed commit
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          ROLLBACK: ${{ needs.plan.outputs.rollback }}
          ROLLED_BACK_TO: ${{ needs.plan.outputs.tag }}
        run: |
          if [ "$ROLLBACK" = "true" ]; then
            echo "### Rolled back to \`$ROLLED_BACK_TO\`" >> "$GITHUB_STEP_SUMMARY"
            echo "No new tag: the release is still \`$ROLLED_BACK_TO\`." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/release.mjs tag --sha "$SHA"
          fi
