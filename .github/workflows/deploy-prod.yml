# Production is deployed by a person, on purpose (architecture §18).
#
# `workflow_dispatch` only, and the `production` environment carries a required
# reviewer, so this waits for an approval in GitHub before it does anything.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the word deploy to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure this environment with a required reviewer. That approval is
    # the gate; the input below only guards against a mis-click.
    environment: production

    steps:
      - name: Confirm
        run: |
          [ "${{ inputs.confirm }}" = "deploy" ] || {
            echo "Type 'deploy' to confirm." >&2
            exit 1
          }

      - uses: actions/checkout@v4

      - name: What is configured
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          supabase=false; expo=false
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROD_PROJECT_REF" ] && supabase=true
          [ -n "$EXPO_TOKEN" ] && expo=true
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "expo=$expo" >> "$GITHUB_OUTPUT"

      # Both consumers need dist/: app.config.ts imports @circles/config, and the
      # Edge Functions import @circles/domain through the import map. dist/ is
      # gitignored, so it exists only after a build. `pnpm check` gets away
      # without this because `typecheck` runs `tsc -b` first and leaves the
      # output behind; nothing on the deploy path does. This has to come before
      # the Supabase steps, not just before the export.
      - name: Build the workspace packages
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'
        run: pnpm run build

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.supabase == 'true'
        with:
          version: latest

      - name: Show the migration plan before applying it
        if: steps.config.outputs.supabase == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
          supabase db push --linked --dry-run

      - name: Push migrations
        if: steps.config.outputs.supabase == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.config.outputs.expo == 'true' || steps.config.outputs.supabase == 'true'

      # A web build with no EXPO_PUBLIC_SUPABASE_URL compiles, deploys and
      # serves a client that cannot reach its backend. Fail here instead, where
      # the message says which variable is missing.
      - name: Check the client configuration
        if: steps.config.outputs.expo == 'true'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
          REQUIRE_TURNSTILE: 'true'
        run: node scripts/check-client-env.mjs

      - name: Deploy the web build
        if: steps.config.outputs.expo == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ORIGIN: ${{ vars.EXPO_PUBLIC_APP_ORIGIN }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -o pipefail
          pnpm --filter app exec eas whoami
          pnpm --filter app run export
          pnpm --filter app exec eas deploy --prod --non-interactive
