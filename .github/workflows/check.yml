# The gate. It runs exactly what `pnpm check` runs locally (architecture §16),
# because a CI that checks something different is a CI people learn to ignore.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per branch. A newer push makes an older run irrelevant.
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Gitleaks reads the PR's commits; nothing here writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks diffs the pull request against its base, so it needs the
          # history. The default shallow clone leaves it with nothing to
          # compare and it exits 1 having scanned nothing.
          fetch-depth: 0

      - name: Look for secrets before doing anything else
        # Cheap, and the one failure where finishing the build first would be
        # actively unhelpful.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: What kind of change is this
        id: scope
        # The job always runs and always reports, even for prose. Skipping it
        # with `paths-ignore` would skip gitleaks too, and a Markdown file is
        # exactly where somebody pastes a token. It would also leave a required
        # status check permanently pending once branch protection is on.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            files=$(git diff --name-only "$base...HEAD" 2>/dev/null || true)
          else
            before="${{ github.event.before }}"
            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null || true)
            else
              files=""
            fi
          fi
          kind=$(printf '%s\n' "$files" | node scripts/ci-scope.mjs)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "### Gate: $kind" >> "$GITHUB_STEP_SUMMARY"
          if [ "$kind" = "prose" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Only Markdown and \`.claude/\` changed. Secret scanning and \`format:check\` still ran; the suites cannot be affected by these files, so they did not." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Needed either way: prose still gets Prettier. Root Markdown is
      # formatted (`docs/` is not), so this is the one gate prose can fail.
      - run: pnpm install --frozen-lockfile

      - name: Formatting only
        if: steps.scope.outputs.kind == 'prose'
        run: pnpm run format:check

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.scope.outputs.kind == 'code'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - if: steps.scope.outputs.kind == 'code' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.kind == 'code'
        with:
          version: latest

      - name: Start Supabase
        if: steps.scope.outputs.kind == 'code'
        # `pnpm check` resets the database and runs pgTAP, and `check:types`
        # generates types from the live schema. Only the database is needed:
        # every other service is time we would spend on nothing.
        run: supabase start -x realtime,storage-api,imgproxy,studio,inbucket,edge-runtime,logflare,vector,supavisor

      - name: pnpm check
        if: steps.scope.outputs.kind == 'code'
        run: pnpm check

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
