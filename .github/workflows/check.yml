# The gate. It runs exactly what `pnpm check` runs locally (architecture §16),
# because a CI that checks something different is a CI people learn to ignore.
#
# `pnpm check` is `check:static`, `check:stack` and `test:e2e:live`, and each
# is a job here, side by side (SUS-179: one job took 27 of its 30 minutes, 15 of
# them the live suite). The live suite is sharded across two runners. The last
# job, named `check`, is the one verdict: `deploy-dev`, `deploy-prod`
# (scripts/green-check.mjs) and the branch protection on `main` ask for a
# check named `check`, and it succeeds only when every other job did.
# `check:workflows` holds that shape in place.
name: check

on:
  pull_request:
  push:
    branches: [main]
  # The content bots' pull request (ADR 0089). A push made with GITHUB_TOKEN
  # starts no `pull_request` run, so after each push the content workflows
  # dispatch this one on the `content-data` branch; its `check` job reports
  # on the branch's head commit, which is what the pull request is waiting for.
  # Anyone can also run it by hand on any branch from the Actions tab. It is
  # judged against `main`, as a pull request is.
  workflow_dispatch:

concurrency:
  # One run per branch. A newer push makes an older run irrelevant, except on
  # `main`: a `main` check that a later merge cancels is a commit `deploy-dev`
  # and `deploy-prod` have no verdict for, and on 2 October three in a row were
  # cancelled while their commits were deployed (SUS-105).
  #
  # `cancel-in-progress: false` alone is not enough: a group holds one running
  # and one pending run, and a third push cancels the pending one. So on `main`
  # every commit gets a group of its own and no run is ever replaced.
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege. Gitleaks reads the PR's commits; nothing here writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Gitleaks diffs the pull request against its base, so it needs the
          # history. The default shallow clone leaves it with nothing to
          # compare and it exits 1 having scanned nothing.
          fetch-depth: 0

      - name: Look for secrets before doing anything else
        # Cheap, and the one failure where finishing the build first would be
        # actively unhelpful: every other job waits for this one.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: What kind of change is this
        id: scope
        # The workflow always runs and always reports, even for prose. Skipping
        # it with `paths-ignore` would skip gitleaks too, and a Markdown file is
        # exactly where somebody pastes a token. It would also leave a required
        # status check permanently pending once branch protection is on.
        env:
          # Through the environment for the same reason as deploy-dev: nothing
          # from the event payload is interpolated into a script.
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A dispatch has no base_ref; its base is main.
            base="origin/${BASE_REF:-main}"
            files=$(git diff --name-only "$base...HEAD" 2>/dev/null || true)
          else
            before="${BEFORE}"
            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$before" "${SHA}" 2>/dev/null || true)
            else
              files=""
            fi
          fi
          kind=$(printf '%s\n' "$files" | node scripts/ci-scope.mjs)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "### Gate: $kind" >> "$GITHUB_STEP_SUMMARY"
          if [ "$kind" = "prose" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Only Markdown changed. Secret scanning and \`format:check\` still ran; the suites cannot be affected by these files, so they did not." >> "$GITHUB_STEP_SUMMARY"
          fi

  # `pnpm check:static`: formatting, lint, the small checks, typecheck and the
  # unit tests. No database. For prose it is Prettier and the docs check.
  static:
    name: static
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `check:migrations` compares with the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Needed either way: prose still gets Prettier and the docs check. Root
      # Markdown is formatted (`docs/` is not), and `check:docs` fails on a
      # link to nothing or an ADR whose frontmatter has drifted from its
      # status line, so these are the two gates prose can fail.
      - run: pnpm install --frozen-lockfile

      # The unimported-file check reads Markdown and `.claude/` too: a script
      # only a doc or a skill names is reached because of that mention, so
      # deleting the mention is a change the check must see (SUS-145).
      - name: Prose only — formatting, the docs check and the unimported-file check
        if: needs.scope.outputs.kind == 'prose'
        run: pnpm run format:check && pnpm run check:docs && node scripts/check-unimported.mjs

      - name: pnpm check:static
        if: needs.scope.outputs.kind == 'code'
        env:
          # What `check:migrations` compares the migrations with: the pull
          # request's base branch, so a PR stacked on another ticket's branch
          # holds one new migration, not the stack's. Through the environment,
          # never interpolated into the script.
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: pnpm run check:static

  # `pnpm check:stack`: pgTAP, the integration suite, the generated types and
  # the smoke suite, against a local Supabase.
  database:
    name: database
    needs: scope
    if: needs.scope.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The smoke suite is Chromium only.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: pnpm exec playwright install chromium

      - name: Chromium's system libraries
        timeout-minutes: 12
        run: scripts/playwright-deps.sh chromium

      # Edge Functions import `@circles/domain` and `@circles/contracts` from
      # `dist/`, which is gitignored, so the runtime cannot even start without
      # it — `failed to read file: packages/contracts/dist/index.js`. `pnpm
      # check` builds it as a side effect of `typecheck`, but that runs *after*
      # the stack is up, so the stack has to be given it first. The deploy
      # workflows learned the same thing (AGENTS.md, "the deploy workflows are
      # not `pnpm check`"); enabling `edge-runtime` here brings the lesson
      # along with it.
      - name: Build the workspace packages
        run: pnpm run build

      - name: Start Supabase
        # The workspace CLI, not `supabase/setup-cli`. There were two of them:
        # the action installed `latest` for this step while `pnpm check`'s own
        # `db:test` and `check:types` resolved the pinned devDependency through
        # node_modules/.bin — so one job could use two versions, and CI could
        # test against a CLI nobody has locally. The action also resolves
        # `latest` through the GitHub API, which rate-limited and failed a run.
        #
        # `check:stack` resets the database and runs pgTAP, `check:types`
        # generates types from the live schema, and `test:integration` drives
        # the real sign-in journey.
        #
        # **`inbucket` and `edge-runtime` are no longer excluded**, and were
        # until S1-14. That suite reads a sign-in code out of Mailpit and calls
        # `create-circle`, `redeem-invite` and `claim-identity` — without those
        # two services the gate passes locally, where the whole stack is up, and
        # fails here. AGENTS.md promises the two are the same command;
        # excluding a service the gate needs is how that promise quietly stops
        # being true.
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      - name: pnpm check:stack
        run: pnpm run check:stack

      - name: What the smoke suite ran
        # The smoke suite retries twice in CI; this is where a test that needed
        # them is named (SUS-124).
        if: always()
        run: node scripts/live-summary.mjs playwright-report/smoke-results.json "" "Smoke suite"

      - name: Upload the Playwright report
        # Not `failure()`: a job that hit its timeout is cancelled, and that is
        # exactly when the report is wanted.
        if: ${{ !success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # `pnpm test:e2e:live`, in two shards on two runners, each with a stack of its
  # own. Playwright splits the tests of all five projects between them.
  live:
    name: live (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard failing says nothing about the other, and the second report
      # is worth having.
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Two engines since S1-31: Chromium for Chrome on Android and the Android
      # in-app browsers, WebKit for mobile Safari and the iOS ones. The browser
      # set is in the key, so a cache made before WebKit was added is not taken
      # for one that has it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download Chromium and WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: pnpm exec playwright install chromium webkit

      # The cache holds the browsers, not the system libraries they load, and
      # the runner image has Chromium's but not WebKit's (GStreamer, libwoff,
      # libavif …). This step is an apt-get that has twice sat until the job's
      # timeout (SUS-143), so it has a limit of its own and tries three times.
      - name: WebKit's and Chromium's system libraries
        timeout-minutes: 12
        run: scripts/playwright-deps.sh chromium webkit

      - name: Build the workspace packages
        run: pnpm run build

      - name: Start Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor

      # SUS-223. On 15 Oct two shards lost their Edge runtime container within
      # twenty seconds of the first test: Kong answered 503 "name resolution
      # failed" to every function call from then on, so each join, save and
      # sign-in failed at once and the run looked like a join-flow race. The
      # container has no restart policy, so a crash is permanent for the
      # shard. This gives it one, so a dead runtime should cost a few failed
      # tests that the retry can cover. It does not hide the crash: the step
      # below warns on any restart and records why the container went.
      - name: Let the Edge runtime restart if it dies
        run: |
          n=0
          for c in $(docker ps --format '{{.Names}}' | grep '^supabase_edge_runtime_' || true); do
            docker update --restart=on-failure:5 "$c"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::warning::no Edge runtime container found to give a restart policy"
          fi

      - name: pnpm test:e2e:live (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm run test:e2e:live --shard="$SHARD"

      - name: What the shard ran
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/live-summary.mjs playwright-report/live-results.json "$SHARD"

      - name: Why a stack container went (exit code, OOM, last log lines)
        if: always()
        run: |
          restarted=$(docker ps -a --format '{{.Names}}' | grep '^supabase_' | xargs -r -n1 docker inspect --format '{{if gt .RestartCount 0}}{{.Name}} {{end}}' || true)
          if [ -n "$restarted" ]; then
            echo "::warning::Stack container(s) restarted during the run: $restarted"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "no stack container restarted"
            exit 0
          fi
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            echo "== $c"
            docker inspect "$c" --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} error={{.State.Error}} finished={{.State.FinishedAt}}'
          done
          echo "== edge runtime log"
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_edge_runtime_'); do docker logs --tail 80 "$c" 2>&1; done
          echo "== host"
          free -m; sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          sudo dmesg 2>/dev/null | grep -i -E 'oom|killed process' | tail -5 || true

      - name: Upload the Playwright report and traces
        # Not `failure()`: a job that hit its timeout is cancelled, and that is
        # exactly when the report is wanted.
        if: ${{ !success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # One per shard: the same name twice is an error.
          name: playwright-report-live-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The verdict. Its name is the contract: `scripts/green-check.mjs`, the
  # branch protection on `main` and `deploy-dev`'s wait all read a check named
  # `check`. `if: always()` is what makes it a verdict: without it a failed
  # dependency makes this job *skipped*, and a skipped required check counts as
  # passing.
  check:
    name: check
    needs: [scope, static, database, live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every suite job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-verdict.mjs
