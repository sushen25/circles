# Development clients for iOS and Android, built on EAS (architecture §4).
#
# Wired now, deliberately not scheduled: Slice 3 is where native delivery
# starts, and until then a development client is only needed when someone asks
# for one. Run it from the EAS dashboard or `eas workflow:run`.
name: build-development

on:
  workflow_dispatch:

jobs:
  android:
    name: Android development client
    type: build
    params:
      platform: android
      profile: development

  ios:
    name: iOS development client
    type: build
    params:
      platform: ios
      profile: development
